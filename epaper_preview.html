    <script>
        window.addEventListener('load', function() {
            var map = map_0d33a40e809c87e7e6ccfee5ade9e4bf;

            // 1. Restore saved pan & zoom
            var savedLat = localStorage.getItem('offshore_ink_lat');
            var savedLng = localStorage.getItem('offshore_ink_lng');
            var savedZoom = localStorage.getItem('offshore_ink_zoom');
            if (savedLat !== null && savedLng !== null && savedZoom !== null) {
                map.setView([parseFloat(savedLat), parseFloat(savedLng)], parseInt(savedZoom), {animate: false});
            }

            // Save pan & zoom whenever the user moves the map
            map.on('moveend zoomend', function() {
                var center = map.getCenter();
                localStorage.setItem('offshore_ink_lat', center.lat);
                localStorage.setItem('offshore_ink_lng', center.lng);
                localStorage.setItem('offshore_ink_zoom', map.getZoom());
            });

            // 2. Restore saved base layer selection
            var savedBase = localStorage.getItem('offshore_ink_baselayer');
            if (savedBase) {
                document.querySelectorAll('.leaflet-control-layers-base label').forEach(function(label) {
                    if (label.textContent.trim() === savedBase) {
                        var input = label.querySelector('input');
                        if (input && !input.checked) input.click();
                    }
                });
            }

            // Restore saved overlay checkboxes (e.g. Nautical Seamarks)
            document.querySelectorAll('.leaflet-control-layers-overlays label').forEach(function(label) {
                var name = label.textContent.trim();
                var savedState = localStorage.getItem('offshore_ink_overlay_' + name);
                var input = label.querySelector('input');
                if (savedState === 'true' && input && !input.checked) input.click();
                if (savedState === 'false' && input && input.checked) input.click();
            });

            // Save layer changes whenever the user toggles them
            map.on('baselayerchange', function(e) {
                localStorage.setItem('offshore_ink_baselayer', e.name.trim());
            });
            map.on('overlayadd', function(e) {
                localStorage.setItem('offshore_ink_overlay_' + e.name.trim(), 'true');
            });
            map.on('overlayremove', function(e) {
                localStorage.setItem('offshore_ink_overlay_' + e.name.trim(), 'false');
            });
        });
    </script>
